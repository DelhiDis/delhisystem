<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Info System (DiS) | Professional IT & Security Solutions</title>
    <!-- Google Fonts से आपका असली प्रीमियम फॉन्ट -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* मोबाइल पर बिना किसी रुकावट के सुपर-स्मूथ स्क्रॉलिंग और लाइटवेट इन-बिल्ट CSS */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        html { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        body { background-color: #f8fafc; color: #334155; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

        /* टॉप इंफो पट्टी */
        .top-banner { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
        .top-banner a { color: white; text-decoration: none; margin-right: 20px; }
        .pulse-text { color: #fbbf24; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        /* मोबाइल फ्रेंडली वाइट हेडर */
        header { background: rgba(255, 255, 255, 0.98); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-bottom: 1px solid #f1f5f9; width: 100%; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: #2563eb; color: white; padding: 8px 14px; font-weight: 900; border-radius: 12px; font-size: 22px; }
        .logo-text h1 { font-size: 20px; color: #0f172a; font-weight: 900; line-height: 1.1; }
        .logo-text p { font-size: 11px; color: #2563eb; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }
        
        /* मेनू लिंक्स जो डेस्कटॉप पर दिखेंगे */
        .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
        .nav-links a { text-decoration: none; color: #475569; font-weight: 700; font-size: 14px; transition: color 0.2s; }
        .nav-links a:hover { color: #2563eb; }
        
        /* बटन ग्रुप (जो मोबाइल और कंप्यूटर दोनों पर हमेशा चालू रहेगा) */
        .header-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-appointment { background: #2563eb; color: white; padding: 10px 20px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-appointment:hover { background: #1d4ed8; }
        .btn-homevisit { background: #10b981; color: white; padding: 10px 20px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-homevisit:hover { background: #059669; }

        /* हीरो सेक्शन */
        .hero { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 80px 20px; text-align: center; position: relative; }
        .certified-tag { background: rgba(59,130,246,0.2); border: 1px solid rgba(96,165,250,0.3); color: #93c5fd; font-weight: 800; padding: 6px 16px; border-radius: 9999px; font-size: 12px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px; }
        .hero h2 { font-size: 44px; font-weight: 900; max-width: 850px; margin: 0 auto 20px auto; line-height: 1.25; }
        .hero h2 span { color: #fbbf24; }
        .hero p { font-size: 16px; color: #cbd5e1; max-width: 720px; margin: 0 auto 35px auto; line-height: 1.7; font-weight: 500; }
        
        .hero-buttons { display: flex; justify-content: center; gap: 14px; max-width: 500px; margin: 0 auto; }
        .hero-btn-primary { background: #fbbf24; color: #0f172a; padding: 12px 24px; border-radius: 12px; font-weight: 800; text-decoration: none; font-size: 14px; box-shadow: 0 4px 12px rgba(251,191,36,0.2); text-align: center; }
        .hero-btn-whatsapp { background: #059669; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 800; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }

        /* सर्विसेज ग्रिड */
        .services-section { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h3 { font-size: 30px; font-weight: 900; color: #0f172a; }
        .section-header p { color: #64748b; margin-top: 8px; font-size: 15px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .service-card { background: white; padding: 30px; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: transform 0.2s; }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .icon-blue { background: #eff6ff; color: #2563eb; }
        .icon-amber { background: #fef3c7; color: #d97706; }
        .icon-purple { background: #f3e8ff; color: #9333ea; }
        .service-card h4 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
        .service-card p { color: #475569; font-size: 13.5px; line-height: 1.6; }

        /* बुकिंग फॉर्म */
        .booking-section { max-width: 600px; margin: 60px auto; padding: 0 20px; }
        .form-box { background: white; padding: 30px; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-box h3 { font-size: 24px; font-weight: 900; color: #0f172a; margin-bottom: 20px; text-align: center; }
        .form-box input, .form-box textarea { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; color: #0f172a; outline: none; transition: border 0.2s; }
        .form-box input:focus, .form-box textarea:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; background: #2563eb; color: white; padding: 14px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 15px; }

        /* QR कोड पॉप-अप */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: white; color: #333333; padding: 30px; border-radius: 18px; max-width: 390px; width: 100%; text-align: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: popup 0.2s ease-out; }
        @keyframes popup { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 26px; background: none; border: none; color: #aaa; cursor: pointer; font-weight: bold; }
        .modal-box h3 { color: #2563eb; margin-bottom: 6px; font-size: 20px; font-weight: 700; }
        .modal-box p { font-size: 13px; color: #555555; margin-bottom: 15px; line-height: 1.5; }
        .qr-img { width: 220px; height: 220px; border: 2px solid #f1f5f9; padding: 8px; background: white; border-radius: 12px; margin: 0 auto 15px auto; display: block; }
        .upi-id { background: #f8fafc; padding: 10px; border-radius: 10px; font-weight: 700; color: #0f172a; font-size: 13.5px; border: 1px dashed #cbd5e0; word-break: break-all; }

        /* स्पेशल मोबाइल स्क्रीन ऑप्टिमाइजेशन */
        @media (max-width: 768px) {
            .nav-links, .top-banner div:last-child { display: none; }
            .nav-container { padding: 12px 15px; }
            .logo-text h1 { font-size: 17px; }
            .logo-box { padding: 6px 10px; font-size: 18px; }
            .hero { padding: 50px 15px; }
            .hero h2 { font-size: 28px; }
            .hero p { font-size: 14px; margin-bottom: 25px; }
            .hero-buttons { flex-direction: column; gap: 10px; }
            .hero-btn-primary, .hero-btn-whatsapp { width: 100%; padding: 12px; font-size: 14px; }
            .header-buttons { gap: 6px; }
            .btn-appointment, .btn-homevisit { padding: 8px 12px; font-size: 12px; border-radius: 8px; }
            .services-section { margin: 40px auto; }
            .section-header h3 { font-size: 24px; }
            .form-box { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- टॉप बार -->
    <div class="top-banner">
        <div>
            <a href="tel:+918920799177"><i class="fas fa-phone-alt"></i> +91 8920799177</a>
        </div>
        <div>● Doorstep Support Within 30 Mins!</div>
    </div>

    <!-- नेविगेशन हेडर -->
    <header>
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-box">DiS</div>
                <div class="logo-text">
                    <h1>Delhi Info System</h1>
                    <p>Premium IT Solutions</p>
                </div>
            </div>
            <!-- डेस्कटॉप मेनू लिंक्स -->
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#services">Our Services</a></li>
                <li><a href="#booking">Book Appointment</a></li>
            </ul>
            <!-- मोबाइल और डेस्कटॉप दोनों पर दिखने वाले एक्टिव बटन्स -->
            <div class="header-buttons">
                <button class="btn-appointment" onclick="document.getElementById('booking').scrollIntoView();">Book Now</button>
